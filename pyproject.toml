[project]
name = "airgap-rag"
version = "0.1.0"
description = "Fully offline, self-hosted RAG service for air-gapped environments"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
